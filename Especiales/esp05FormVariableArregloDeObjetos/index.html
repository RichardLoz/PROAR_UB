<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Form Variable Arreglo Objetos</title>
</head>
<body>

    <header>
        <h1>Formulario de ALTA - Lenguaje de programación</h1>
    </header>

    <main>
        <form action="respuesta.html" method="get" id="formularioLenguaje">

            <div class="campo">
                <label for="nombre">Nombre del lenguaje:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. JavaScript" required>
            </div>

            <div class="campo">
                <label for="paradigma">Paradigma:</label>
                <select name="paradigma" id="paradigma" required></select>
            </div>

            <div class="campo">
                <label for="anio_aparicion">Año de aparición:</label>
                <input type="number" id="anio_aparicion" name="anio_aparicion" min="1940" max="2030" placeholder="Ej. 1995" required>
            </div>

            <div class="campo">
                <label for="ranking">Puesto en el ranking TIOBE:</label>
                <input type="number" id="ranking" name="ranking" min="1" placeholder="Ej. 6" required>
            </div>

            <div class="campo campo-check">
                <input type="checkbox" id="tipado_estatico" name="tipado_estatico">
                <label for="tipado_estatico">Tipado estático</label>
            </div>

            <div class="campo">
                <label for="fecha_ultima_version">Fecha de última versión:</label>
                <input type="date" id="fecha_ultima_version" name="fecha_ultima_version" required>
            </div>

            <button type="submit">Enviar</button>

        </form>
    </main>

    <footer>
        <p>© 2026 Catálogo de lenguajes - Rlozano</p>
    </footer>

    <script src="../recursos/jquery.js"></script>
    <script src="./script.js"></script>
</body>
</html>
