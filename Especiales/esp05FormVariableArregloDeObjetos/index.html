<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Form Renglón de orden de compra</title>
</head>
<body>

    <header>
        <h1>Formulario de ALTA - Renglón de orden de compra.</h1>
    </header>

    <main>
        <form action="respuesta.html" method="get" id="formularioRenglon">

            <div class="campo">
                <label for="nro_orden">Nro de orden:</label>
                <input type="number" id="nro_orden" name="nro_orden" min="1" placeholder="Ej. 1001" required>
            </div>

            <div class="campo">
                <label for="codigo_producto">Código de producto:</label>
                <input type="text" id="codigo_producto" name="codigo_producto" placeholder="Ej. PRD-001" required>
            </div>

            <div class="campo">
                <label for="descripcion">Descripción:</label>
                <input type="text" id="descripcion" name="descripcion" placeholder="Ej. Aceite de girasol" required>
            </div>

            <div class="campo">
                <label for="cantidad">Cantidad:</label>
                <input type="number" id="cantidad" name="cantidad" min="0" step="any" placeholder="Ej. 10" required>
            </div>

            <div class="campo">
                <label for="unidad_medida">Unidad de medida:</label>
                <select name="unidad_medida" id="unidad_medida" required></select>
            </div>

            <div class="campo">
                <label for="precio_unitario">Precio unitario:</label>
                <input type="number" id="precio_unitario" name="precio_unitario" min="0" step="0.01" placeholder="Ej. 1500.50" required>
            </div>

            <div class="campo">
                <label for="importe_renglon">Importe del renglón:</label>
                <input type="number" id="importe_renglon" name="importe_renglon" step="0.01" placeholder="Cantidad x Precio unitario" readonly>
            </div>

            <div class="campo">
                <label for="pdf_comprobante">PDF comprobante (orden de compra):</label>
                <input type="file" id="pdf_comprobante" name="pdf_comprobante" accept="application/pdf" required>
            </div>

            <button type="submit">Enviar</button>

        </form>
    </main>

    <footer>
        <p>© 2026 Órdenes de compra - Rlozano</p>
    </footer>

    <script src="../recursos/jquery.js"></script>
    <script src="./script.js"></script>
</body>
</html>
