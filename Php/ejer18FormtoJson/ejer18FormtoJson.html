<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renglones de Ordenes de Compra</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>

<body>
    <header>
        <h1>Renglones de Ordenes de Compra</h1>
    </header>

    <main class="container">
        <!-- Envio tradicional: method post + enctype multipart (necesario para subir el PDF) hacia respuesta.php -->
        <form class="card" id="formRenglon" action="respuesta.php" method="post" enctype="multipart/form-data">
            <h2>Alta de Renglon</h2>

            <!-- Grilla de 2 columnas; los campos con clase "ancho" ocupan toda la fila -->
            <div class="grilla">
                <div class="campo">
                    <label for="nroOrden">Nro de Orden</label>
                    <input type="number" name="nroOrden" id="nroOrden" min="1" required>
                </div>
                <div class="campo">
                    <label for="codigoProducto">Codigo de Producto</label>
                    <input type="text" name="codigoProducto" id="codigoProducto" required>
                </div>
                <div class="campo ancho">
                    <label for="descripcion">Descripcion</label>
                    <input type="text" name="descripcion" id="descripcion" required>
                </div>
                <div class="campo">
                    <label for="cantidad">Cantidad</label>
                    <input type="number" name="cantidad" id="cantidad" min="0" step="any" required>
                </div>
                <div class="campo">
                    <label for="unidadDeMedida">Unidad de Medida</label>
                    <select name="unidadDeMedida" id="unidadDeMedida" required>
                        <option value="1">1 - Kg</option>
                        <option value="2">2 - Uni</option>
                        <option value="3">3 - Lata</option>
                        <option value="4">4 - Caja</option>
                        <option value="5">5 - Litro</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="precioUnitario">Precio Unitario</label>
                    <input type="number" name="precioUnitario" id="precioUnitario" min="0" step="0.01" required>
                </div>
                <div class="campo">
                    <label for="importeRenglon">Importe Renglon (cantidad x precio)</label>
                    <!-- readonly (no disabled) para que el valor igual viaje en el envio -->
                    <input type="number" name="importeRenglon" id="importeRenglon" readonly>
                </div>
                <div class="campo ancho">
                    <label for="pdfComprobante">PDF Comprobante (orden de compra)</label>
                    <input type="file" name="pdfComprobante" id="pdfComprobante" accept="application/pdf" required>
                </div>
            </div>

            <div class="botones">
                <!-- Boton 1: submit normal del form, el navegador carga respuesta.php -->
                <button type="submit" class="btn btn-secundario">Enviar form de manera tradicional</button>
                <!-- Boton 2: type=button para que NO envie el form; lo maneja jQuery con AJAX -->
                <button type="button" class="btn btn-primario" id="enviarAjax">Disparar requerimiento asincronico AJAX</button>
            </div>
        </form>
    </main>

    <!-- Overlay de carga: tapa la pantalla mientras el servidor demora -->
    <div class="overlay" id="overlay" hidden>
        <div class="overlay-caja">
            <div class="loader"></div>
            <p>Procesando requerimiento...</p>
            <small>Esperando respuesta del servidor</small>
        </div>
    </div>

    <footer>
        <h1>Alumno: Ricardo Lozano</h1>
    </footer>

    <script>
        // Importe = Cantidad x Precio Unitario, se recalcula al tipear
        function calcularImporte() {
            const importe = parseFloat($("#cantidad").val()) * parseFloat($("#precioUnitario").val());
            $("#importeRenglon").val(isNaN(importe) ? "" : importe.toFixed(2));
        }
        $("#cantidad, #precioUnitario").on("input", calcularImporte);

        // Envio asincronico: no recarga la pagina, el servidor demora 3 segundos
        $("#enviarAjax").click(function () {
            const form = $("#formRenglon")[0];
            // Como el boton no es submit, validamos a mano los campos required
            if (!form.reportValidity()) return;

            $("#overlay").show();                      // muestra el loader
            $("#enviarAjax").prop("disabled", true);   // evita doble click mientras espera

            $.ajax({
                type: "post",
                url: "./index.php",
                data: new FormData(form),  // incluye el PDF
                processData: false,        // necesario para enviar FormData con archivo
                contentType: false,
                dataType: "json",          // parsea la respuesta JSON
                success: function (renglon) {
                    $("#overlay").hide();
                    // alert bloquea, por eso se oculta el loader antes de mostrarlo
                    alert(JSON.stringify(renglon, null, 2)); // JSON indentado
                },
                error: function () {
                    $("#overlay").hide();
                    alert("Error al procesar el requerimiento");
                },
                complete: function () {
                    // Se ejecuta siempre (exito o error): rehabilita el boton
                    $("#enviarAjax").prop("disabled", false);
                }
            });
        });
    </script>
</body>

</html>
