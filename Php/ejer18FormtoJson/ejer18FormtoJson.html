<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renglones de Ordenes de Compra</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>

<body>
    <header>
        <h1>Renglones de Ordenes de Compra</h1>
    </header>
    <div class="container">
        <button class="abrir">Alta Renglon</button>
        <dialog class="modal">
            <div class="primero"><button class="cerrar" type="button">X</button></div>
            <!-- Envio tradicional: method post + enctype multipart (necesario para subir el PDF) hacia respuesta.php -->
            <form class="segundo" id="formRenglon" action="respuesta.php" method="post" enctype="multipart/form-data">
                <label for="nroOrden">Nro de Orden:</label><br>
                <input type="number" name="nroOrden" id="nroOrden" min="1" required><br>
                <label for="codigoProducto">Codigo de Producto:</label><br>
                <input type="text" name="codigoProducto" id="codigoProducto" required><br>
                <label for="descripcion">Descripcion:</label><br>
                <input type="text" name="descripcion" id="descripcion" required><br>
                <label for="cantidad">Cantidad:</label><br>
                <input type="number" name="cantidad" id="cantidad" min="0" step="any" required><br>
                <label for="unidadDeMedida">Unidad de Medida:</label><br>
                <select name="unidadDeMedida" id="unidadDeMedida" required>
                    <option value="1">1 - Kg</option>
                    <option value="2">2 - Uni</option>
                    <option value="3">3 - Lata</option>
                    <option value="4">4 - Caja</option>
                    <option value="5">5 - Litro</option>
                </select><br>
                <label for="precioUnitario">Precio Unitario:</label><br>
                <input type="number" name="precioUnitario" id="precioUnitario" min="0" step="0.01" required><br>
                <label for="importeRenglon">Importe Renglon:</label><br>
                <!-- readonly (no disabled) para que el valor igual viaje en el envio -->
                <input type="number" name="importeRenglon" id="importeRenglon" readonly><br>
                <label for="pdfComprobante">PDF Comprobante (orden de compra):</label><br>
                <input type="file" name="pdfComprobante" id="pdfComprobante" accept="application/pdf" required><br><br>

                <!-- Boton 1: submit normal del form, el navegador carga respuesta.php -->
                <button type="submit" class="enviar">enviar form de manera tradicional</button><br>
                <!-- Boton 2: type=button para que NO envie el form; lo maneja jQuery con AJAX -->
                <button type="button" class="enviar" id="enviarAjax">Disparar requerimiento asincronico AJAX</button>

                <!-- Loader: oculto hasta que se dispara el AJAX -->
                <div class="loader" id="loader" hidden></div>
            </form>
        </dialog>
        <!-- Modal de resultado del AJAX -->
        <dialog class="modal modalResultado" id="modalResultado">
            <h2>Respuesta del servidor (JSON):</h2>
            <table class="datos" id="tablaResultado"></table>
            <br><button type="button" class="enviar" id="cerrarResultado">Cerrar</button>
        </dialog>
    </div>
    <footer>
        <h1>Alumno: Ricardo Lozano</h1>
    </footer>

    <script>
        const Modal = document.querySelector(".modal")
        const Abrirmodal = document.querySelector(".abrir")
        const Cerrarmodal = document.querySelector(".cerrar")
        const ModalResultado = document.getElementById("modalResultado")

        // Deja el formulario vacio (reset() tambien limpia el input file)
        function limpiar() {
            $("#formRenglon")[0].reset();
            $("#importeRenglon").val("");
        }

        // Importe = Cantidad x Precio Unitario, se recalcula al tipear
        function calcularImporte() {
            const importe = parseFloat($("#cantidad").val()) * parseFloat($("#precioUnitario").val());
            $("#importeRenglon").val(isNaN(importe) ? "" : importe.toFixed(2));
        }
        $("#cantidad, #precioUnitario").on("input", calcularImporte);

        Abrirmodal.addEventListener("click", () => {
            Modal.showModal();
        })
        Cerrarmodal.addEventListener("click", () => {
            limpiar();
            Modal.close();
        });
        $("#cerrarResultado").click(function () {
            ModalResultado.close();
            limpiar();
            Modal.close();
        });

        // Envio asincronico: no recarga la pagina, el servidor demora 3 segundos
        $("#enviarAjax").click(function () {
            const form = $("#formRenglon")[0];
            // Como el boton no es submit, validamos a mano los campos required
            if (!form.reportValidity()) return;

            $("#loader").show();                       // muestra el loader
            $("#enviarAjax").prop("disabled", true);   // evita doble click mientras espera

            $.ajax({
                type: "post",
                url: "./index.php",
                data: new FormData(form),  // incluye el PDF
                processData: false,        // necesario para enviar FormData con archivo
                contentType: false,
                dataType: "json",          // parsea la respuesta JSON
                success: function (renglon) {
                    // Arma una fila por cada campo del JSON
                    $("#tablaResultado").empty();
                    $.each(renglon, function (campo, valor) {
                        $("#tablaResultado").append($("<tr>").append($("<th>").text(campo), $("<td>").text(valor)));
                    });
                    ModalResultado.showModal();
                },
                error: function () {
                    alert("Error al procesar el requerimiento");
                },
                complete: function () {
                    // Se ejecuta siempre (exito o error): oculta loader y rehabilita el boton
                    $("#loader").hide();
                    $("#enviarAjax").prop("disabled", false);
                }
            });
        });
    </script>
</body>

</html>
